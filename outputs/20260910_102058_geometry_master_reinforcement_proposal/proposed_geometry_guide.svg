15" class="label">같은 좌표의 평면도</text><text x="660" y="142" class="small">청록색 = 물체를 놓지 않는 연속 통로 예시</text><rect x="735" y="225" width="320" height="320" fill="#e5eaf0" stroke="#233f60" stroke-width="2"/><rect x="735" y="417" width="256" height="64" fill="#6bcbb5" fill-opacity=".75"/><rect x="927" y="225" width="64" height="256" fill="#6bcbb5" fill-opacity=".75"/><rect x="754.2" y="244.2" width="147.2" height="147.2" fill="#c5cedb" stroke="#6c7f98" stroke-width="1.4" stroke-dasharray="5 4"/><text x="827.8" y="301.8" text-anchor="middle" class="small">건물·소품</text><text x="827.8" y="327.4" text-anchor="middle" class="small">배치 영역 예시</text><line x1="767" y1="225" x2="767" y2="545" stroke="#8095aa" stroke-opacity=".25"/><line x1="735" y1="257" x2="1055" y2="257" stroke="#8095aa" stroke-opacity=".25"/><line x1="799" y1="225" x2="799" y2="545" stroke="#8095aa" stroke-opacity=".25"/><line x1="735" y1="289" x2="1055" y2="289" stroke="#8095aa" stroke-opacity=".25"/><line x1="831" y1="225" x2="831" y2="545" stroke="#8095aa" stroke-opacity=".25"/><line x1="735" y1="321" x2="1055" y2="321" stroke="#8095aa" stroke-opacity=".25"/><line x1="863" y1="225" x2="863" y2="545" stroke="#8095aa" stroke-opacity=".25"/><line x1="735" y1="353" x2="1055" y2="353" stroke="#8095aa" stroke-opacity=".25"/><line x1="895" y1="225" x2="895" y2="545" stroke="#8095aa" stroke-opacity=".25"/><line x1="735" y1="385" x2="1055" y2="385" stroke="#8095aa" stroke-opacity=".25"/><line x1="927" y1="225" x2="927" y2="545" stroke="#8095aa" stroke-opacity=".25"/><line x1="735" y1="417" x2="1055" y2="417" stroke="#8095aa" stroke-opacity=".25"/><line x1="959" y1="225" x2="959" y2="545" stroke="#8095aa" stroke-opacity=".25"/><line x1="735" y1="449" x2="1055" y2="449" stroke="#8095aa" stroke-opacity=".25"/><line x1="991" y1="225" x2="991" y2="545" stroke="#8095aa" stroke-opacity=".25"/><line x1="735" y1="481" x2="1055" y2="481" stroke="#8095aa" stroke-opacity=".25"/><line x1="1023" y1="225" x2="1023" y2="545" stroke="#8095aa" stroke-opacity=".25"/><line x1="735" y1="513" x2="1055" y2="513" stroke="#8095aa" stroke-opacity=".25"/><line x1="735" y1="225" x2="927" y2="225" stroke="#35577c" stroke-width="7"/><line x1="991" y1="225" x2="1055" y2="225" stroke="#35577c" stroke-width="7"/><line x1="735" y1="225" x2="735" y2="417" stroke="#35577c" stroke-width="7"/><line x1="735" y1="481" x2="735" y2="545" stroke="#35577c" stroke-width="7"/><text x="959" y="209" class="small" text-anchor="middle">출구 2</text><text x="717" y="449" class="small" text-anchor="end">출구 1</text><text x="959" y="513" text-anchor="middle" class="small">열린 중앙</text><text x="660" y="590" class="small">• 출구 문틀뿐 아니라 중앙 → 문턱 → 바깥 연결을 확인</text><text x="660" y="619" class="small">• 상자·잔해·돌출 장비는 통로 밖에 배치</text><text x="660" y="648" class="small">• 실제 건물 배치·통로 폭·카메라 각도의 고정안은 아님</text><text x="660" y="677" class="small">• 두 도식은 동일한 XYZ 좌표를 사용한 설명용 예시</text><text x="40" y="729" font-size="14" fill="#67778a">원본 마스터를 대체하지 않는 제안 도식입니다. 파란 벽·격자·점선·색 띠·글자는 최종 콘셉트 아트의 출력 요소가 아닙니다.</text></svg>
